name: Build render engine (concat-cli)

# Auto-edit's Trigger.dev worker drives the Concat video engine through
# its JSON-RPC API (`concat-cli api`). Compiling Concat takes minutes and
# a full Rust toolchain, so it is built here once, from a pinned commit,
# and published as a release asset of this repo. The worker image
# (apps/web/trigger.config.ts) downloads that asset and checks its
# sha256; it never compiles Concat.
#
# Built inside debian:bookworm, the same Debian release as Trigger.dev's
# node base image, so the binary links against the glibc it runs with.
# Concat is AGPL-3.0 and runs unmodified as a separate process; its
# LICENSE and trademark policy ship inside the tarball next to the
# binary, with the exact source commit in SOURCE.txt.
#
# To bump: change CONCAT_COMMIT (and RELEASE_TAG), run this workflow,
# then put the new tag and sha256 in apps/web/src/lib/auto-edit/toolchain.ts.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/concat-cli-release.yml"

permissions:
  contents: write

env:
  CONCAT_REPO: https://github.com/jub0t/Concat
  CONCAT_COMMIT: 60ecb4a1fda62501f67afaf7e036143c95f196f8
  RUST_VERSION: 1.93.1
  RELEASE_TAG: concat-cli-60ecb4a
  # Concat's own pins (scripts/ci/deps.lock at CONCAT_COMMIT).
  FF_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-shared-8.1.tar.xz
  FF_SHA: 76649c19a7a4615b367251ba4a8adc643f65831278a00e7a0c38398f7f06484b
  ORT_URL: https://github.com/microsoft/onnxruntime/releases/download/v1.28.0/onnxruntime-linux-x64-1.28.0.tgz
  ORT_SHA: a3e1b79d7bb1bf09696ce675f49e4064e6c81f6202b8225624fff0e93f8d6407

jobs:
  build:
    name: concat-cli (linux x64, bookworm)
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: System packages
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends ca-certificates curl git xz-utils build-essential \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libgl1-mesa-dev libgtk-3-dev \
            libclang-dev clang cmake pkg-config libssl-dev

      - name: Release already published?
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG")
          echo "exists=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Prebuilt FFmpeg 8.1 and ONNX Runtime (digest-checked)
        if: steps.existing.outputs.exists != 'true'
        run: |
          mkdir -p /opt/tp && cd /opt/tp
          curl -sSL -o ffmpeg.tar.xz "$FF_URL" && echo "$FF_SHA  ffmpeg.tar.xz" | sha256sum -c
          mkdir ffmpeg && tar -xf ffmpeg.tar.xz -C ffmpeg --strip-components=1
          curl -sSL -o ort.tgz "$ORT_URL" && echo "$ORT_SHA  ort.tgz" | sha256sum -c
          mkdir ort && tar -xzf ort.tgz -C ort --strip-components=1
          ln -sf libonnxruntime.so.1.28.0 ort/lib/libonnxruntime.so

      - name: Rust toolchain
        if: steps.existing.outputs.exists != 'true'
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        if: steps.existing.outputs.exists != 'true'
        run: |
          git clone -q "$CONCAT_REPO" /opt/concat
          git -C /opt/concat checkout -q "$CONCAT_COMMIT"
          cd /opt/concat/src
          FFMPEG_DIR=/opt/tp/ffmpeg ORT_LIB_LOCATION=/opt/tp/ort/lib ORT_PREFER_DYNAMIC_LINK=1 \
            cargo +"$RUST_VERSION" build --locked --release -p concat-cli

      - name: Package with licence and notices
        if: steps.existing.outputs.exists != 'true'
        run: |
          out=/opt/pkg/concat-cli
          mkdir -p "$out"
          cp /opt/concat/src/target/release/concat-cli "$out/"
          strip "$out/concat-cli" || true
          for f in LICENSE LICENSE.md COPYING NOTICE NOTICE.md TRADEMARK.md THIRD_PARTY_NOTICES.md THIRD-PARTY-NOTICES.md; do
            [ -f "/opt/concat/$f" ] && cp "/opt/concat/$f" "$out/"
          done
          cat > "$out/SOURCE.txt" <<EOF
          concat-cli, built unmodified from $CONCAT_REPO at commit $CONCAT_COMMIT
          (Rust $RUST_VERSION, FFmpeg 8.1 BtbN shared build, ONNX Runtime 1.28.0 as pinned by Concat).
          Source: $CONCAT_REPO/tree/$CONCAT_COMMIT
          Licence: AGPL-3.0-or-later (see LICENSE). "Concat" is a trademark of its author (see TRADEMARK.md).
          Built by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          echo "Shared libraries the binary needs:"
          LD_LIBRARY_PATH=/opt/tp/ffmpeg/lib:/opt/tp/ort/lib ldd "$out/concat-cli"
          LD_LIBRARY_PATH=/opt/tp/ffmpeg/lib:/opt/tp/ort/lib "$out/concat-cli" --version || true
          cd /opt/pkg && tar -czf concat-cli-linux-x64.tar.gz concat-cli
          sha256sum concat-cli-linux-x64.tar.gz | tee concat-cli-linux-x64.tar.gz.sha256

      - name: Publish release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api=https://api.github.com/repos/${{ github.repository }}
          sha=$(cut -d' ' -f1 /opt/pkg/concat-cli-linux-x64.tar.gz.sha256)
          body=$(printf 'concat-cli built unmodified from %s at %s for the Auto-edit render worker.\\n\\nsha256 (concat-cli-linux-x64.tar.gz): %s' "$CONCAT_REPO" "$CONCAT_COMMIT" "$sha")
          id=$(curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/releases" \
            -d "{\"tag_name\":\"$RELEASE_TAG\",\"target_commitish\":\"${{ github.sha }}\",\"name\":\"Render engine $RELEASE_TAG\",\"body\":\"$body\",\"prerelease\":true}" \
            | sed -n 's/^  "id": \([0-9]*\),$/\1/p' | head -1)
          [ -n "$id" ] || { echo "release not created"; exit 1; }
          for f in concat-cli-linux-x64.tar.gz concat-cli-linux-x64.tar.gz.sha256; do
            curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary "@/opt/pkg/$f" "https://uploads.github.com/repos/${{ github.repository }}/releases/$id/assets?name=$f" > /dev/null
          done
          echo "Published $RELEASE_TAG, sha256 $sha"
