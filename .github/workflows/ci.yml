name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: apps/web — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # next build generates .next/types/ (the LayoutProps/PageProps
      # helper types every route file references) — tsc --noEmit must
      # run AFTER a build exists, never before. This had been in the
      # wrong order since CI was first scaffolded: the web job never
      # passed a single time until this fix, because every push ran a
      # fresh checkout with no prior .next/ directory. Reproduced and
      # confirmed locally (rm -rf .next && npx tsc --noEmit fails the
      # same way; it passes once a build has run first) before
      # reordering, rather than guessing at the fix.
      - run: npm run build
      - run: npx tsc --noEmit

  db:
    name: supabase — migrations + pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # CI runners have plenty of RAM, unlike the dev environment this
      # suite was originally authored in — `supabase start` (local
      # Postgres + Auth + Storage via Docker Compose) is the right choice
      # here, not a connection to the real production project. Every test
      # file wraps its fixtures in begin/rollback, so even if this were
      # pointed at a real project nothing would persist — but running
      # locally means CI never needs a production DB credential at all.
      - run: supabase start
      - run: supabase db push --local
      - run: supabase test db --local

  # Playwright e2e lands once apps/web has routes worth testing end to end.
  # Provider adapter contract tests (vitest, apps/web/src/lib/providers/)
  # landed in M3, run as part of the `web` job above via `npm test` —
  # they run against recorded fixtures only, no live provider calls, per
  # spec M3's own "Done when" requirement.
